name: CI

# Validates pull requests. Pushes to main are built + checked by deploy-pages.yml.
on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Build client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7
          if-no-files-found: error

  server:
    name: Check server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Skip the optional native dep (duckdb) — not needed to validate the code.
      - run: npm ci --omit=optional
      - name: Syntax-check server sources
        run: |
          node --check index.js
          node --check lib/reviews.js
          node --check scripts/add-review.mjs
