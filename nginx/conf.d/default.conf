# Main site — qualitymetalcarportsca.com
server {
    listen 80;
    server_name qualitymetalcarportsca.com www.qualitymetalcarportsca.com;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all unmatched paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reviews & leads API — proxy to qmc-server
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://qmc-server:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Booking — book.qualitymetalcarportsca.com → Cal.com
server {
    listen 80;
    server_name book.qualitymetalcarportsca.com;
    location / {
        proxy_pass http://cal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

