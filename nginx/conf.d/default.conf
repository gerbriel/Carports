# Blog — blog.qualitymetalcarportsca.com → Ghost CMS
server {
    listen 80;
    server_name blog.qualitymetalcarportsca.com;
    client_max_body_size 50M;
    location / {
        proxy_pass http://ghost:2368;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Support / Live Chat — support.qualitymetalcarportsca.com → Chatwoot
server {
    listen 80;
    server_name support.qualitymetalcarportsca.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://chatwoot-rails:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # WebSocket support — required for real-time chat
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
